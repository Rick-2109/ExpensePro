<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <form>
    <div class="blocoGeral">
      <img src="assets/logo-expense-pro.png" alt="" class="imagemTitulo">

        <input type="email" placeholder="Email" id="emailInput">
        <input type="password" placeholder="Senha" id="senhaInput">
      </div>
      <div>
        <button id="enviarBtn" type="button">Enviar</button>
      </div>
    </div>
  </form>
</body>
</html>
