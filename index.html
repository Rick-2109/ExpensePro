<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <form>
    <div class="blocoGeral">
      <img src="assets/logo-expense-pro.png" alt="" class="imagemTitulo">
      <div class="login">
        <input type="email" placeholder="Email" id="emailInput">
        <input type="password" placeholder="Senha" id="senhaInput">
      </div>
      <div>
        <button id="enviarBtn" type="button">Enviar</button>
      </div>
      <div class="demonstracao">
        <button id="mostrarPersonasBtn" type="button">Acesso rápido para demonstração</button>
        <div id="opcoesPersonas" hidden>
          <button class="personaBtn" type="button" data-email="gustavo34@gexpensepro.com" data-senha="1235">Entrar como Gustavo</button>
          <button class="personaBtn" type="button" data-email="marcia@expensepro.com" data-senha="1236">Entrar como Márcia</button>
          <button class="personaBtn" type="button" data-email="henrique@expensepro.com" data-senha="1237">Entrar como Henrique</button>
        </div>
      </div>
    </div>
  </form>
</body>
</html>
